name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install
      - name: typecheck
        run: pnpm -r --if-present -F '!@zjf-harness/evals' typecheck
      - name: test
        run: pnpm -r --if-present -F '!@zjf-harness/evals' test
